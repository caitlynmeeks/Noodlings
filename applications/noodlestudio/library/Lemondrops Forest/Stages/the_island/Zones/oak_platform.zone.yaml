name: "Oak Platform"
id: "oak_platform"

spatial:
  center: [0, 60, 0]
  radius: 20.0
  falloff: 8.0
  shape: "sphere"

text:
  description: |
    At the very top of the great oak, a wooden platform extends between the
    highest branches. From here you can see the entire island. Fairynaut
    gliders are parked along one edge, ready for launch.

  features:
    - "FAIRYNAUT GLIDERS with gossamer wings line the launch rail."
    - "A TELESCOPE points toward the distant mountains."
    - "Wind chimes made of crystals sing in the breeze."

  exits:
    down: "great_oak"
    glide: "curvy_airport"

perception:
  visibility: 100.0
  audibility: 20.0
  lighting: "bright_sky"

ambient:
  sounds: ["strong_wind", "wind_chimes", "glider_wings"]
  mood: "exhilarating"
  temperature: "cool"
