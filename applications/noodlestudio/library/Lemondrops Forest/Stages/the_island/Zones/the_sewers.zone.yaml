name: "The Sewers"
id: "the_sewers"

spatial:
  center: [0, -15, -140]
  radius: 25.0
  falloff: 10.0
  shape: "cylinder"

text:
  description: |
    Beneath the village, ancient brick tunnels carry... actually quite
    clean water. A gondola waits at a small dock, ready to take visitors
    deeper. Fairy lights string along the curved ceiling. And there's
    something large and scaly down the main channel.

  features:
    - "A GONDOLA with velvet seats waits at the dock."
    - "FAIRY LIGHTS twinkle along the arched ceiling."
    - "THE ALLIGATOR - a submarine shaped like... an alligator."

  exits:
    up: "waterfront_village"
    submarine: "alligator_interior"

perception:
  visibility: 20.0
  audibility: 30.0
  lighting: "fairy_lights"

ambient:
  sounds: ["water_echo", "dripping", "distant_splashing"]
  mood: "mysterious"
  temperature: "cool_damp"
