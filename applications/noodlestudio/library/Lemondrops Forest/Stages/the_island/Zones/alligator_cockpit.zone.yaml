name: "Alligator Cockpit"
id: "alligator_cockpit"

spatial:
  center: [0, -18, -180]
  radius: 10.0
  falloff: 3.0
  shape: "sphere"

text:
  description: |
    The command center of the alligator submarine. Through the eyes
    (which are windows), you can see the underwater world. The controls
    are labeled in a language you don't recognize. There's a big red
    button marked "BITE".

  features:
    - "THE BITE BUTTON - big, red, tempting."
    - "A LOW RIDER STEERING WHEEL with chrome chains."
    - "DINGLE BALLS hang from the rearview mirror (what?)"
    - "The EYES are panoramic windows to the deep."

  exits:
    back: "alligator_interior"

perception:
  visibility: 50.0
  audibility: 10.0
  lighting: "dashboard_glow"

ambient:
  sounds: ["sonar_ping", "engine_purr", "underwater_ambience"]
  mood: "adventurous"
  temperature: "controlled"
