name: "Burger Drome"
id: "burger_drome"

spatial:
  center: [60, 10, -120]
  radius: 20.0
  falloff: 8.0
  shape: "sphere"

text:
  description: |
    A building shaped EXACTLY like a giant hamburger sits on pylons over
    the water. The bun is the roof, the patty is the main floor, and the
    lettuce forms balconies. Inside, Eddie Deezen's ghost haunts the kitchen.

  features:
    - "THE BUILDING IS A HAMBURGER. On pylons. Over water."
    - "A NEON SIGN flickers: 'Best Burgers in the Multiverse'."
    - "The SESAME SEED roof tiles occasionally pop off in the wind."

  exits:
    west: "waterfront_village"

perception:
  visibility: 40.0
  audibility: 25.0
  lighting: "neon_glow"

ambient:
  sounds: ["sizzling_grill", "retro_music", "seagulls"]
  mood: "nostalgic"
  temperature: "greasy_warm"
