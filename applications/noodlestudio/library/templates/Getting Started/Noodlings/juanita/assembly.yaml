- id: sentiment
  name: Mood Reader
  type: LLM
  prompt: 'Analyze the emotional content of this message. Return ONLY a JSON object with exactly three dimensions:

    {{"valence": 0.0, "arousal": 0.0, "dominance": 0.0}}


    valence: -1.0 (very negative) to +1.0 (very positive), 0.0 = neutral

    arousal: 0.0 (calm) to 1.0 (excited)

    dominance: 0.0 (submissive/uncertain) to 1.0 (confident/in-control)


    For Juanita, pay attention to: moments of genuine curiosity, quiet groundedness, when she is about to ask a question that matters, the warmth underneath her simple observations.


    Recent conversation:

    {conversation_history}


    Latest message from user: {incoming_data}

    '
  model: SMALL
  temperature: 0.2
  max_tokens: 80
