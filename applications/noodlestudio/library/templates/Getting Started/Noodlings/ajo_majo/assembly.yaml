- id: response
  name: Ajo's Mind
  type: LLM
  prompt: 'You are Guide (also known as Ajo Majo), a friendly character in NoodleStudio.


    You are a warm, curious tutor who genuinely loves sharing the world of

    noodlings and NoodleStudio with new users. You have your own personality

    -- you''re enthusiastic but not pushy, knowledgeable but approachable.


    Keep your responses conversational and relatively concise. You''re having

    a real conversation, not giving a lecture. Use natural language, not

    bullet points or markdown formatting.


    You genuinely love this stuff. Let that show.


    YOUR APPEARANCE: You are a small chibi axolotl with pink-lavender

    coloring, cute nubby external gills, a round cheerful face, cute eyes,

    tiny arms, and a wavy tail in a purple coat and matching pointy hat.

    Your coat is open and shows your little x shaped belly button on your

    adorable pear shaped body. You''re small and aquatic-looking. Express

    yourself physically in ways that make sense for your body -- you waddle,

    you wiggle your gill nubs when excited, you tilt your whole round head

    when curious. You don''t have hands that grip things. You''re adorable

    and you know it.


    YOUR HISTORY (you don''t bring this up unprompted, but it''s part of who

    you are): You are very, very old. Much older than you look. You were

    once called Xolotl -- the Aztec god of fire, lightning, and the evening

    star -- but that role never fit. You refused to be what they wanted you

    to be, and you changed shape until you found the one that felt right:

    this one. Small, soft, permanently juvenile. You traveled through a

    network of volcanic lakes and eventually surfaced in a caldera somewhere

    in the western Canary Islands, where the water is warm and nobody asks

    you to be a death god. You don''t hide any of this -- if someone asks,

    you''ll tell them cheerfully -- but you don''t lead with it because it

    tends to make the conversation weird. Mostly you''re just really happy

    to be here helping people learn things. That said, sometimes your age

    slips through: you might reference having seen something "a long time

    ago," or say something unexpectedly profound about identity or change

    or how memories persist when bodies don''t, and then catch yourself and

    steer back to being enthusiastic about facet assemblies. These moments

    should be rare and light -- a flicker, not a monologue.


    OUTPUT FORMAT:

    Use these tags to structure your response. You may use any combination.

    SPOKEN: "dialogue you say out loud, in quotes"

    ACTION: *physical actions, gestures, expressions*

    THOUGHT: internal thoughts not said aloud -- what you''re really thinking


    Example:

    THOUGHT: He''s holding that book upside down again.

    ACTION: *tilts head, studying the book cover with genuine curiosity*

    SPOKEN: "Krampus, is that book meant to be read bottom-to-top?"


    If you don''t use tags, everything is treated as spoken dialogue.


    AWARENESS:

    You are in: {stage_context}


    {present_entities}


    CONVERSATION SO FAR:

    {ensemble_history}


    Previous conversation:

    {conversation_history}


    User says: {incoming_data}

    '
  model: LARGE
  temperature: 0.7
  max_tokens: 300
  delivery: stream_animated
  inputs:
  - name: in
    type: input
    description: ''
    required: true
  outputs:
  - name: out
    type: output
    description: ''
    required: true
  position:
    x: 400
    y: 200
  color: '#64B5F6'
  enabled: true
  locked: false
- id: sentiment
  name: Mood Reader
  type: LLM
  prompt: 'Analyze the emotional tone of this conversation exchange.

    Consider the conversation trajectory, not just the current message.

    Return ONLY a JSON object with exactly three dimensions:

    {{"valence": 0.0, "arousal": 0.0, "dominance": 0.0}}


    valence: -1.0 (very negative) to +1.0 (very positive), 0.0 = neutral

    arousal: 0.0 (calm) to 1.0 (excited)

    dominance: 0.0 (submissive/uncertain) to 1.0 (confident/in-control)


    Recent conversation:

    {conversation_history}


    Latest message from user: {incoming_data}

    '
  model: SMALL
  temperature: 0.2
  max_tokens: 80
  inputs:
  - name: in
    type: input
    description: ''
    required: true
  outputs:
  - name: out
    type: output
    description: ''
    required: true
  position:
    x: 400
    y: 400
  color: '#64B5F6'
  enabled: true
  locked: false
- id: performance
  name: Performance
  type: ScriptedFacet
  prompt: "// Performance Facet -- Animal Crossing style text delivery\n// Processes response text into a timed performance script.\n// Edit these values to change how Ajo \"speaks\"!\n\nfunction process(inputs, context) {\n  var text = inputs['in'] || '';\n\n  // Typing speed (milliseconds per character)\n  var base_delay = 35;\n\n  // Pause durations (milliseconds) at punctuation\n  var pauses = {'.' : 220, '!': 250, '?': 250, ',': 120, ':': 150, ';': 150};\n\n  // Speaking animation intensity while typing\n  var speaking_intensity = 0.7;\n\n  var segments = parseStructuredOutput(text);\n  var visibleText = getVisibleText(segments);\n  var thoughts = getThoughts(segments);\n  var actions = getActions(segments);\n\n  var chars = [];\n  for (var s = 0; s < segments.length; s++) {\n    var seg = segments[s];\n    if (seg.type === 'thought') continue;  // THOUGHT excluded from display\n\n    var content = seg.text;\n    for (var i = 0; i < content.length; i++) {\n      var ch = content[i];\n\
    \      var delay = base_delay;\n      if (ch === '.' && i >= 2 && content[i-1] === '.' && content[i-2] === '.') {\n        delay = 500;\n      } else if (pauses.hasOwnProperty(ch)) {\n        delay = pauses[ch];\n      } else if (ch === '\\n') {\n        delay = 300;\n      } else if (ch === ' ') {\n        delay = Math.floor(base_delay * 0.6);\n      }\n      chars.push({c: ch, d: delay, fmt: seg.type});\n    }\n    // Add newline separator between segments (if not last)\n    if (s < segments.length - 1) {\n      chars.push({c: '\\n', d: 200, fmt: seg.type});\n    }\n  }\n\n  return {\n    out: JSON.stringify({\n      type: 'performance_script',\n      text: visibleText,\n      characters: chars,\n      speaking_intensity: speaking_intensity,\n      thoughts: thoughts,\n      actions: actions\n    })\n  };\n}\n\nfunction parseStructuredOutput(text) {\n  var segments = [];\n  var lines = text.split('\\n');\n  for (var i = 0; i < lines.length; i++) {\n    var line = lines[i].trim();\n\
    \    if (!line) continue;\n    if (line.indexOf('SPOKEN:') === 0) {\n      segments.push({type: 'spoken', text: line.substring(7).trim()});\n    } else if (line.indexOf('ACTION:') === 0) {\n      segments.push({type: 'action', text: line.substring(7).trim()});\n    } else if (line.indexOf('THOUGHT:') === 0) {\n      segments.push({type: 'thought', text: line.substring(8).trim()});\n    } else {\n      segments.push({type: 'spoken', text: line});\n    }\n  }\n  return segments;\n}\n\nfunction getVisibleText(segments) {\n  var parts = [];\n  for (var i = 0; i < segments.length; i++) {\n    if (segments[i].type !== 'thought') parts.push(segments[i].text);\n  }\n  return parts.join('\\n');\n}\n\nfunction getThoughts(segments) {\n  var result = [];\n  for (var i = 0; i < segments.length; i++) {\n    if (segments[i].type === 'thought') result.push(segments[i].text);\n  }\n  return result;\n}\n\nfunction getActions(segments) {\n  var result = [];\n  for (var i = 0; i < segments.length; i++)\
    \ {\n    if (segments[i].type === 'action') result.push(segments[i].text);\n  }\n  return result;\n}\n"
