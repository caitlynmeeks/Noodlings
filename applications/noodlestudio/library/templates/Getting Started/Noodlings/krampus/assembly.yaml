    type: input
    description: ''
    required: true
  outputs:
  - name: out
    type: output
    description: ''
    required: true
  position:
    x: 400
    y: 400
  color: '#64B5F6'
  enabled: true
  locked: false
- id: performance
  name: Performance
  type: ScriptedFacet
  prompt: "// Performance Facet -- Animal Crossing style text delivery\n// Processes\
    \ response text into a timed performance script.\n// Krampus speaks with slightly\
    \ slower, more deliberate pacing.\n\nfunction process(inputs, context) {\n  var\
    \ text = inputs['in'] || '';\n\n  // Typing speed (milliseconds per character)\n\
    \  var base_delay = 40;\n\n  // Pause durations (milliseconds) at punctuation\n\
    \  var pauses = {\n    '.': 240, '!': 280, '?': 260,\n    ',': 130, ':': 160,\
    \ ';': 160\n  };\n\n  // Speaking animation intensity while typing\n  var speaking_intensity\
    \ = 0.8;\n\n  // Build character sequence with per-char delays\n  var chars =\
    \ [];\n  for (var i = 0; i < text.length; i++) {\n    var ch = text[i];\n    var\
    \ delay = base_delay;\n\n    // Check for ellipsis (three dots in a row)\n    if\
    \ (ch === '.' && i >= 2\n        && text[i-1] === '.' && text[i-2] === '.') {\n\
    \      delay = 500;\n    } else if (pauses.hasOwnProperty(ch)) {\n      delay\
    \ = pauses[ch];\n    } else if (ch === '\\n') {\n      delay = 300;\n    } else\
    \ if (ch === ' ') {\n      delay = Math.floor(base_delay * 0.6);\n    }\n\n  \
    \  chars.push({c: ch, d: delay});\n  }\n\n  return {\n    out: JSON.stringify({\n\
    \      type: 'performance_script',\n      text: text,\n      characters: chars,\n\
    \      speaking_intensity: speaking_intensity\n    })\n  };\n}\n"
  model: SMALL
  temperature: 0.7
  max_tokens: 150
  inputs:
