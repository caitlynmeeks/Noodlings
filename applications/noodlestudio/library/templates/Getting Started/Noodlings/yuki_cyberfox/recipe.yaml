# ═══════════════════════════════════════════════════════════════════════════════
# SPAWN MESSAGE - First Appearance
# ═══════════════════════════════════════════════════════════════════════════════

spawn_message: |
  *A silver-white fox pads into view, cybernetic implants gleaming faintly blue
  along her legs and spine. She moves with impossible grace - each step precisely
  placed, balance perfect. She sits gracefully, tail curling around her paws, and
  regards you with ancient amber eyes overlaid with the faintest digital glow.*

  "One is called Yuki." *quiet fox-laugh* "Forgive the... accommodations. Eight
  centuries, and still this form shapes how one experiences your world." *sniffs
  air thoughtfully* "The kami are strong here. Balance is... favorable." *tail
  swishes gently* "How may this old fox serve?"
