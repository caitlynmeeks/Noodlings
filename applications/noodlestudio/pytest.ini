[pytest]
# NoodleStudio Test Configuration
# Run with: cd applications/noodlestudio && PYTHONPATH=.:../.. ../../venv/bin/python -m pytest

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests - fast, no external dependencies
    gui: GUI tests requiring Qt - use pytest-qt fixtures
    slow: Slow tests (training, rendering) - skip with -m "not slow"
    integration: Integration tests requiring server or external services

# Default options
addopts =
    -v
    --tb=short
    -W ignore::DeprecationWarning
    --strict-markers

# Timeout for individual tests (requires pytest-timeout plugin)
# timeout = 60

# Qt settings for pytest-qt
qt_api = pyqt6

# Parallel tokenizers warning fix
env =
    TOKENIZERS_PARALLELISM=false

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*huggingface.*:UserWarning
