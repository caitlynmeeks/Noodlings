name: Simple Test Assembly
version: 1.0.0
description: Minimal assembly for testing - single intuition facet
author: Noodlings System
tags:
  - test
  - simple
  - example
created: '2025-11-28'
modified: '2025-11-28'

facets:
  - id: INCOMING
    name: INCOMING
    type: SpecialNode
    prompt: ''
    model: qwen/qwen3-4b-2507
    temperature: 0.7
    max_tokens: 150
    inputs: []
    outputs:
      - name: out
        type: output
        description: Raw incoming context
        required: true
    position:
      x: 100
      y: 300
    color: '#76AF6A'
    enabled: true

  - id: intuition
    name: Intuition
    type: IntuitionFacet
    prompt: Analyze the contextual awareness and provide intuitive insights.
    model: qwen/qwen3-4b-2507
    temperature: 0.7
    max_tokens: 150
    inputs:
      - name: context
        type: input
        description: Incoming context
        required: true
    outputs:
      - name: awareness
        type: output
        description: Intuitive awareness
        required: true
    position:
      x: 400
      y: 300
    color: '#64B5F6'
    enabled: true

  - id: OUTGOING
    name: OUTGOING
    type: SpecialNode
    prompt: ''
    model: qwen/qwen3-4b-2507
    temperature: 0.7
    max_tokens: 150
    inputs:
      - name: in
        type: input
        description: Final response
        required: true
    outputs: []
    position:
      x: 700
      y: 300
    color: '#FFA726'
    enabled: true

connections:
  - from: INCOMING.out
    to: intuition.context
  - from: intuition.awareness
    to: OUTGOING.in
