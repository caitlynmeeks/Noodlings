name: Anklebiter Default Cognitive Assembly
version: 1.0.0
description: Standard cognitive architecture for anklebiter species with parallel intuition and emotion processing
author: Noodlings Team
tags:
  - anklebiter
  - default
  - conversation
  - parallel
created: '2025-11-28'
modified: '2025-11-28'

facets:
  - id: INCOMING
    name: INCOMING
    type: SpecialNode
    prompt: ''
    model: qwen/qwen3-4b-2507
    temperature: 0.7
    max_tokens: 150
    inputs: []
    outputs:
      - name: out
        type: output
        description: Raw incoming perception data
        required: true
    position:
      x: 100
      y: 350
    color: '#76AF6A'
    enabled: true

  - id: intuition
    name: Intuition Facet
    type: IntuitionFacet
    prompt: |
      Analyze the contextual awareness of this situation.
      Consider: spatial awareness, social dynamics, implied meanings, and situational context.
      Provide intuitive insights about what's really happening here.
    model: qwen/qwen3-4b-2507
    temperature: 0.7
    max_tokens: 150
    inputs:
      - name: context
        type: input
        description: Raw context from perception
        required: true
    outputs:
      - name: awareness
        type: output
        description: Contextual awareness insights
        required: true
    position:
      x: 350
      y: 250
    color: '#64B5F6'
    enabled: true

  - id: emotion
    name: Emotion Facet
    type: EmotionFacet
    prompt: |
      Evaluate the affective/emotional state evoked by this situation.
      Consider: valence (positive/negative), arousal (calm/excited), and specific emotions.
      How does this make the character feel?
    model: qwen/qwen3-4b-2507
    temperature: 0.8
    max_tokens: 150
    inputs:
      - name: context
        type: input
        description: Raw context from perception
        required: true
    outputs:
      - name: affect
        type: output
        description: Emotional/affective response
        required: true
    position:
      x: 350
      y: 450
    color: '#FFA726'
    enabled: true

  - id: convergence_main
    name: Main Convergence
    type: ConvergenceFacet
    prompt: |
      Synthesize the intuitive awareness and emotional affect into a coherent response.

      You have:
      - Contextual awareness (what's happening, social dynamics, implications)
      - Emotional affect (how it makes you feel, arousal level)

      Integrate these into a natural, character-appropriate response that demonstrates
      both understanding and emotional authenticity.
    model: qwen/qwen3-4b-2507
    temperature: 0.75
    max_tokens: 200
    inputs:
      - name: awareness
        type: input
        description: Intuitive contextual awareness
        required: true
      - name: affect
        type: input
        description: Emotional response
        required: true
    outputs:
      - name: response
        type: output
        description: Integrated cognitive output
        required: true
    position:
      x: 600
      y: 350
    color: '#BA68C8'
    enabled: true

  - id: OUTGOING
    name: OUTGOING
    type: SpecialNode
    prompt: ''
    model: qwen/qwen3-4b-2507
    temperature: 0.7
    max_tokens: 150
    inputs:
      - name: in
        type: input
        description: Final synthesized response
        required: true
    outputs: []
    position:
      x: 850
      y: 350
    color: '#FFA726'
    enabled: true

connections:
  - from: INCOMING.out
    to: intuition.context
  - from: INCOMING.out
    to: emotion.context
  - from: intuition.awareness
    to: convergence_main.awareness
  - from: emotion.affect
    to: convergence_main.affect
  - from: convergence_main.response
    to: OUTGOING.in
