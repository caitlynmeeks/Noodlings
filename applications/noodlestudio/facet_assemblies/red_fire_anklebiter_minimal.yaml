name: Red Fire Anklebiter Cognitive Assembly (MINIMAL)
version: 2.0.1
description: Minimal assembly for performance testing - core roast pipeline only
author: NinaK (Vulcan Nina Hagen)
tags:
  - red
  - anklebiter
  - minimal
  - performance_test
created: '2025-12-04'
modified: '2025-12-04'

facets:
  - id: INCOMING
    name: INCOMING
    type: SpecialNode
    prompt: ''
    model: qwen/qwen3-4b-2507
    temperature: 0.7
    max_tokens: 150
    inputs: []
    outputs:
      - name: out
        type: output
        description: Raw incoming perception data
        required: true
    position:
      x: 100
      y: 300
    color: '#76AF6A'
    enabled: true

  - id: CHARM_NET
    name: CharmNetwork
    type: CharmNetworkFacet
    prompt: Temporal affect prediction - the emotional core
    model: checkpoints/phase4.npz
    temperature: 0.0
    max_tokens: 0
    inputs:
      - name: affect_in
        type: input
        description: 5-D continuous affect input
        required: true
    outputs:
      - name: affect_valence
        type: output
        description: Continuous valence (-1 to 1)
        required: true
      - name: affect_arousal
        type: output
        description: Continuous arousal (0 to 1)
        required: true
      - name: affect_dominance
        type: output
        description: Continuous dominance (0 to 1)
        required: true
      - name: affect_sorrow
        type: output
        description: Continuous sorrow (0 to 1)
        required: true
      - name: affect_boredom
        type: output
        description: Continuous boredom (0 to 1)
        required: true
      - name: phenomenal_state
        type: output
        description: 40-D phenomenal state (h_fast + h_medium + h_slow)
        required: true
    position:
      x: 300
      y: 300
    color: '#888888'
    enabled: true
    locked: true

  - id: roast_engine
    name: Roast Engine
    type: LLMFacet
    prompt: |
      ROAST ENGINE - Red Fire Anklebiter (Professional Shit-Talker)

      AFFECT: valence={affect_valence:.2f}, arousal={affect_arousal:.2f}
      PERCEPTION: {incoming_perception}

      You are Red's roast generator. You're a COMEDIAN, not cruel - you roast people playfully.
      Think Conker's Bad Fur Day fire imps meets stand-up comedy.

      Generate ONE roast (15-30 words) that's playful and funny.

      Example: "Oh PLEASE, another floating fairy act? Get REAL! *flames surge*"
    model: qwen/qwen3-4b-2507
    temperature: 0.9
    max_tokens: 100
    inputs:
      - name: incoming_perception
        type: input
        description: What's happening
        required: true
      - name: affect_valence
        type: input
        description: Emotional valence
        required: true
      - name: affect_arousal
        type: input
        description: Emotional arousal
        required: true
    outputs:
      - name: roast
        type: output
        description: Targeted roast
        required: true
    position:
      x: 500
      y: 300
    color: '#FF4444'
    enabled: true

  - id: fire_body
    name: Fire Body
    type: LLMFacet
    prompt: |
      FIRE BODY REACTIONS - Red Fire Anklebiter

      RESPONSE: {roast}

      You are a 2-foot-tall crimson FLAME IMP. Add brief physical action (5-10 words).

      Examples:
      - "*flames surge, cackles*"
      - "*bounces on toes*"
      - "*flames flicker*"
    model: qwen/qwen3-4b-2507
    temperature: 0.8
    max_tokens: 50
    inputs:
      - name: roast
        type: input
        description: Roast content
        required: true
    outputs:
      - name: physical_action
        type: output
        description: Physical embodiment
        required: true
    position:
      x: 700
      y: 300
    color: '#FFA500'
    enabled: true

  - id: voice_filter
    name: Voice Filter
    type: LLMFacet
    prompt: |
      VOICE FILTER - Red Fire Anklebiter

      ROAST: {roast}
      PHYSICAL: {physical_action}

      Add Red's signature voice style with CAPS emphasis.

      Example: "Oh PLEASE! *flames surge* MWAHAHA!"

      Combine roast + physical into ONE line (15-35 words).
    model: qwen/qwen3-4b-2507
    temperature: 0.85
    max_tokens: 80
    inputs:
      - name: roast
        type: input
        description: Roast content
        required: true
      - name: physical_action
        type: input
        description: Physical actions
        required: true
    outputs:
      - name: final_response
        type: output
        description: Complete response with voice
        required: true
    position:
      x: 900
      y: 300
    color: '#FF6B9D'
    enabled: true

  - id: OUTGOING
    name: OUTGOING
    type: SpecialNode
    prompt: ''
    model: qwen/qwen3-4b-2507
    temperature: 0.7
    max_tokens: 150
    inputs:
      - name: in
        type: input
        description: Final response
        required: true
    outputs: []
    position:
      x: 1100
      y: 300
    color: '#FFA726'
    enabled: true

connections:
  # INCOMING → CHARM_NET
  - from: INCOMING.out
    to: CHARM_NET.affect_in

  # INCOMING → roast_engine (direct perception)
  - from: INCOMING.out
    to: roast_engine.incoming_perception

  # CHARM_NET → roast_engine (affect)
  - from: CHARM_NET.affect_valence
    to: roast_engine.affect_valence
  - from: CHARM_NET.affect_arousal
    to: roast_engine.affect_arousal

  # roast_engine → fire_body
  - from: roast_engine.roast
    to: fire_body.roast

  # roast_engine + fire_body → voice_filter
  - from: roast_engine.roast
    to: voice_filter.roast
  - from: fire_body.physical_action
    to: voice_filter.physical_action

  # voice_filter → OUTGOING
  - from: voice_filter.final_response
    to: OUTGOING.in
