connections:
  # INCOMING → Context Intelligence (THE GOD)
  - from: INCOMING.out
    to: context_intelligence.incoming_data

  # Context Intelligence → CharmNetwork (enriched perception)
  - from: context_intelligence.enriched_perception
    to: CHARM_NET.affect_in

  # Context Intelligence → room_observer (enriched perception!)
  - from: context_intelligence.enriched_perception
    to: room_observer.incoming_data

  # CharmNetwork → room_observer (with affect)
  - from: CHARM_NET.phenomenal_state
    to: room_observer.phenomenal_state
  - from: CHARM_NET.affect_valence
    to: room_observer.affect_valence
  - from: CHARM_NET.affect_arousal
    to: room_observer.affect_arousal
  - from: CHARM_NET.affect_fear
    to: room_observer.affect_fear

  # PARALLEL EXECUTION: Roast gets data directly from Context Intelligence!
  # This allows Observer and Roast to execute IN PARALLEL after CharmNetwork completes!
  - from: context_intelligence.enriched_perception
    to: roast_engine.incoming_perception
  - from: CHARM_NET.affect_valence
    to: roast_engine.affect_valence
  - from: CHARM_NET.affect_arousal
    to: roast_engine.affect_arousal
  - from: CHARM_NET.affect_sorrow
    to: roast_engine.affect_sorrow

  # CharmNetwork → denial_defense (continuous affect monitoring)
  - from: CHARM_NET.affect_valence
    to: denial_defense.affect_valence
  - from: CHARM_NET.affect_arousal
    to: denial_defense.affect_arousal
  - from: CHARM_NET.affect_fear
    to: denial_defense.affect_fear
  - from: INCOMING.out
    to: denial_defense.incoming_data

  # roast_engine + denial_defense → response_selector (picks winner by salience!)
  - from: roast_engine.roast
    to: response_selector.roast
  - from: denial_defense.denial_response
    to: response_selector.denial_response

  # response_selector → fire_body (physical embodiment)
  - from: response_selector.selected_response
    to: fire_body.selected_response

  # response_selector + fire_body → voice_filter (Red's character voice)
  - from: response_selector.selected_response
    to: voice_filter.selected_response
  - from: fire_body.physical_action
    to: voice_filter.physical_action

  # voice_filter → CONVERGENCE (final check before output)
  # CONVERGENCE still gets ALL affect for final decision
  - from: CHARM_NET.affect_valence
    to: CONVERGENCE.affect_valence
  - from: CHARM_NET.affect_arousal
    to: CONVERGENCE.affect_arousal
  - from: CHARM_NET.affect_fear
    to: CONVERGENCE.affect_fear
  - from: CHARM_NET.affect_sorrow
    to: CONVERGENCE.affect_sorrow
  - from: CHARM_NET.affect_boredom
    to: CONVERGENCE.affect_boredom
  - from: room_observer.observations
    to: CONVERGENCE.observations
  - from: roast_engine.roast
    to: CONVERGENCE.roast
  - from: denial_defense.denial_response
    to: CONVERGENCE.denial_response
  - from: fire_body.physical_action
    to: CONVERGENCE.physical_action
  - from: voice_filter.final_response
    to: CONVERGENCE.final_response

  # CONVERGENCE → OUTGOING
  - from: CONVERGENCE.convergent_response
    to: OUTGOING.in

  # SUBCONSCIOUS LAYER (continuous symbolic processing)
  # INCOMING → subconscious_symbolic (with affect from CharmNetwork)
  - from: INCOMING.out
    to: subconscious_symbolic.perception
  - from: CHARM_NET.affect_valence
    to: subconscious_symbolic.affect_valence
  - from: CHARM_NET.affect_arousal
    to: subconscious_symbolic.affect_arousal
  - from: CHARM_NET.affect_fear
    to: subconscious_symbolic.affect_fear
  - from: CHARM_NET.affect_sorrow
    to: subconscious_symbolic.affect_sorrow

  # INSIGHT EMERGENCE (safety-gated release)
  # Gets affect to compute safety salience
  - from: CHARM_NET.affect_valence
    to: insight_emergence.affect_valence
  - from: CHARM_NET.affect_arousal
    to: insight_emergence.affect_arousal
  - from: CHARM_NET.affect_fear
    to: insight_emergence.affect_fear
