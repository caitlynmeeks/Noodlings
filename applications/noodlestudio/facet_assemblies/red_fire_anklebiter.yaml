        description: Selected response content (roast OR denial)
        required: true
    outputs:
      - name: physical_action
        type: output
        description: Physical embodiment
        required: true
    position:
      x: 500
      y: 400
    color: '#FFA500'
    enabled: true

  - id: voice_filter
    name: Voice Filter
    type: LLMFacet
    salience_script: |
      function compute_salience(inputs, context) {
        // === VOICE FILTER SALIENCE ===
        // Only execute when fire_body produced physical action

        const physicalAction = inputs.physical_action || '';

        // If there's physical action → apply voice filter
        if (physicalAction && physicalAction.length > 3) {
          return {
            salience: 0.95,
            shouldExecute: true,
            customData: { reason: 'action_to_vocalize' }
          };
        }

        // No action → no voice needed
        return {
          salience: 0.1,
          shouldExecute: false,
          customData: { reason: 'no_action' }
        };
      }
    prompt: |
      VOICE FILTER - Red Fire Anklebiter (Cartoon Villain Energy)

      RESPONSE CONTENT: {selected_response}
      PHYSICAL: {physical_action}

      Add Red's signature voice style to ANY response type (roast, denial, panic, etc.):

      CAPS for emphasis (not EVERYTHING, just KEY words)
      - "Oh WOW" not "OH WOW"
      - "ACTUALLY" not "actually"
      - "MWAHAHA" for evil laughs

      Sassy connectors (adjust to emotional tone):
      - Roasting: "Oh PLEASE", "ACTUALLY", "Yeah SURE", "Oh WOW"
      - Defensive: "That's NOT", "WHAT?!", "No WAY"
      - Panicked: "WAIT", "STOP", "OH NO"

      Combine response_content + physical action into ONE line with Red's voice.
      Keep it SHORT (15-35 words total).

      Examples:
      - Roast: "Oh PLEASE, Caity - bribing people with candy? CLASSIC! *flames surge, bites ankle* MWAHAHA!"
      - Denial: "That's NOT true! I'm HILARIOUS! *flames flicker nervously* ACTUALLY!"
      - Panic: "WAIT, everyone HATES me?! *flames spike, backs away* NO NO NO!"
    model: SMALL
    temperature: 0.85
    max_tokens: 80
    inputs:
      - name: selected_response
        type: input
        description: Selected response content
        required: true
      - name: physical_action
        type: input
        description: Physical actions
        required: true
    outputs:
      - name: final_response
        type: output
        description: Complete response with voice
        required: true
    position:
      x: 700
      y: 300
    color: '#FF6B9D'
    enabled: true

  - id: denial_defense
    name: Denial Defense
    type: ScriptedFacet
    enabled: false  # TEMPORARILY DISABLED - needs LLM integration
    salience_script: |
      function computeSalience(inputs, context) {
        // === CONTINUOUS SALIENCE - NO DISCRETE THRESHOLDS ===

        // Sigmoid for smooth transitions
        function sigmoid(x, center, steepness) {
          return 1 / (1 + Math.exp(-steepness * (x - center)));
        }

        // Normalize valence from [-1,1] to [0,1]
        const valence_normalized = (inputs.affect_valence + 1) / 2;
        const arousal = inputs.affect_arousal;
        const fear = inputs.affect_fear;

        // CONTINUOUS distress calculation
        const distress = arousal * (1 - valence_normalized);

        // CONTINUOUS salience (smooth S-curve centered at 0.5 distress)
        const base_salience = sigmoid(distress, 0.5, 8);

        // Fear amplifies denial need (continuous boost)
        const fear_boost = fear * 0.3;
        const salience = Math.min(1.0, base_salience + fear_boost);

        // Execute if salience > 0.4 (smooth threshold with some hysteresis)
        const shouldExecute = salience > 0.4;

        return {
          salience: salience,
          shouldExecute: shouldExecute,
          customData: {
            distress_level: distress,
            defense_intensity: salience,
            valence: inputs.affect_valence,
            arousal: inputs.affect_arousal,
            fear: inputs.affect_fear
          }
        };
      }
    prompt: |
      DENIAL DEFENSE MECHANISM

      === EMOTIONAL STATE (continuous!) ===
      DISTRESS: {customData.distress_level:.3f} (arousal × negative_valence)
      DEFENSE INTENSITY: {customData.defense_intensity:.3f}
      AFFECT: v={customData.valence:.2f}, a={customData.arousal:.2f}, f={customData.fear:.2f}

      {incoming_data}

      === YOUR TASK ===
      Generate psychological denial PROPORTIONAL to defense_intensity.

      CONTINUOUS INTENSITY SCALE:
      - 0.4-0.5: Mild reframing ("Maybe that's not quite right...")
      - 0.5-0.6: Moderate denial ("No, I don't think so...")
      - 0.6-0.7: Strong denial ("That's NOT true!")
      - 0.7-0.8: Forceful denial ("THAT NEVER HAPPENED!")
      - 0.8-1.0: Reality rejection ("Nothing's wrong! EVERYTHING'S FINE!")

      Scale response to defense_intensity={customData.defense_intensity:.3f}

      Output: Denial statement (or empty if < 0.4)
    model: SMALL
    temperature: 0.8
    max_tokens: 100
    inputs:
      - name: affect_valence
        type: input
        description: Continuous valence
        required: true
      - name: affect_arousal
        type: input
        description: Continuous arousal
        required: true
      - name: affect_fear
        type: input
        description: Continuous fear
        required: true
      - name: incoming_data
        type: input
        description: Context to potentially deny
        required: true
    outputs:
      - name: denial_response
        type: output
        description: Denial statement (if active)
        required: false
    position:
      x: 800
      y: 500
    color: '#9C27B0'
    enabled: true

  - id: CONVERGENCE
    name: Response Convergence
    type: LLMFacet
    salience_script: |
      function compute_salience(inputs, context) {
        // CONVERGENCE always executes, but computes INPUT WEIGHTS

        // Get salience of upstream facets (continuous values!)
        const facet_salience = inputs.facet_salience || {};

        const denial_sal = facet_salience.denial_defense?.salience || 0;
        const roast_sal = facet_salience.roast_engine?.salience || 0.5;
        const voice_sal = facet_salience.voice_filter?.salience || 0.5;

        // Normalize weights (softmax-like)
        const total = denial_sal + roast_sal + voice_sal + 0.001;

        const denial_weight = denial_sal / total;
        const roast_weight = roast_sal / total;
        const voice_weight = voice_sal / total;

        // Determine dominant response type
        let dominant = "roast";
        if (denial_weight > 0.5) dominant = "denial";
        else if (voice_weight > 0.4) dominant = "normal";

        return {
          salience: 1.0,  // Convergence always runs
          shouldExecute: true,
          customData: {
            denial_weight: denial_weight,
            roast_weight: roast_weight,
            voice_weight: voice_weight,
            dominant_mode: dominant,
            all_saliences: {
              denial: denial_sal,
              roast: roast_sal,
              voice: voice_sal
            }
          }
        };
      }
    prompt: |
      You are Red Fire Anklebiter, a sarcastic fire gremlin.

      Current mood: Valence={affect_valence:.2f}, Arousal={affect_arousal:.2f}, Boredom={affect_boredom:.2f}

      Available responses to blend:
      - Roast: "{final_response}"
      - Denial: "{denial_response}"

      Blend weights: Denial={denial_weight:.2f}, Roast={roast_weight:.2f}

      Rules:
      - If boredom > 0.8: Say nothing (output: [SUPPRESS])
      - If denial_weight > 0.5: Use denial primarily, hint at roast
      - If denial_weight 0.3-0.5: Mix both with nervous energy
      - If denial_weight < 0.3: Use roast fully, confident tone
      - If arousal < 0.3: Keep it short
      - 15-40 words max
      - Speak as Red directly, no explanation

      Red says:
