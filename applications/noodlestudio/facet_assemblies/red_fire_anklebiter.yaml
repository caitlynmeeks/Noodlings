    required: true
  - name: affect_dominance
    type: input
    description: Dominance level
    required: true
  - name: affect_sorrow
    type: input
    description: Sorrow level
    required: true
  outputs:
  - name: red_response
    type: output
    description: Red's complete response
    required: true
  position:
    x: 1300.0
    y: 100.0
  color: '#FF0000'
  enabled: true
  locked: false
  salience_script: "function compute_salience(inputs, context) {\n  // Check CONTEXT\
    \ for incoming_data (not inputs - those aren't populated yet!)\n  const incoming\
    \ = context.incoming_data || '';\n\n  if (incoming && incoming.trim().length >\
    \ 0) {\n    return {\n      salience: 1.0,\n      shouldExecute: true,\n     \
    \ customData: { reason: 'reactive_response', incoming_length: incoming.length\
    \ }\n    };\n  }\n\n  // No incoming data = autonomous cycle, Red stays quiet\n\
    \  return {\n    salience: 0.0,\n    shouldExecute: false,\n    customData: {\
    \ reason: 'no_incoming_data_staying_quiet' }\n    };\n}\n"
