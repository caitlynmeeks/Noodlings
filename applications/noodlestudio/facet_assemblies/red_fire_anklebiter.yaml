  - id: insight_emergence
    name: Insight Emergence
    type: InsightEmergenceFacet
    salience_script: |
      function compute_salience(inputs, context) {
        // === SAFETY-GATED INSIGHT RELEASE ===

        function sigmoid(x, midpoint, steepness) {
          return 1 / (1 + Math.exp(-steepness * (x - midpoint)));
        }

        // Get current affect
        const arousal = inputs.affect?.arousal || 0.5;
        const valence = inputs.affect?.valence || 0.0;

        // Get denial facet salience (defenses)
        const denial_salience = context.facet_salience?.denial_defense || 0.0;

        // SAFETY = calm + defenses down
        const calm = 1 - arousal;  // 0 to 1
        const defenses_down = 1 - denial_salience;  // 0 to 1

        const safety = calm * defenses_down;

        // Sigmoid curve - need SIGNIFICANT safety (>0.7) to break through
        const salience = sigmoid(safety, 0.7, 10);

        // Boost if valence is positive (feeling good helps)
        const valence_boost = valence > 0 ? valence * 0.1 : 0;

        const final_salience = Math.min(1.0, salience + valence_boost);

        return {
          salience: final_salience,
          shouldExecute: final_salience > 0.5,
          customData: {
            safety: safety,
            calm: calm,
            defenses_down: defenses_down
          }
        };
      }
    prompt: |
      INSIGHT EMERGENCE - Translating subconscious symbolism to conscious thought

      SAFETY LEVEL: {customData.safety:.3f}
      CALM: {customData.calm:.3f}, DEFENSES DOWN: {customData.defenses_down:.3f}

      LATENT SYMBOLIC IMAGES (from subconscious):
      {latent_memories}

      Your subconscious has been generating symbolic imagery. Now that you feel SAFE,
      translate the most recent symbolic image into a vulnerable conscious thought.

      Use "privately thinks" format.
      Brief and poetic (1-3 sentences).
      Capture the emotional essence of the symbol.

      Examples:
      Symbol: "marshmallow roasting / flames gentled to hearth glow / trust tastes like sugar"
      Thought: "privately thinks, She treats my flames like campfire light—safe, warm. Not a threat."

      Conscious thought:
    model: SMALL
    temperature: 0.8
    max_tokens: 150
    inputs:
