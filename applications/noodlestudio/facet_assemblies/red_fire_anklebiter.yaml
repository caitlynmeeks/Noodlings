    color: '#B39DDB'
    enabled: true

  - id: room_observer
    name: Room Observer
    type: LLMFacet
    salience_script: |
      function compute_salience(inputs, context) {
        // === ROOM OBSERVER SALIENCE ===
        // Only scan when there's NEW perception or high arousal

        const arousal = inputs.affect_arousal || 0.5;
        const incoming = inputs.incoming_data || '';

        // Always scan if there's actual incoming data
        if (incoming && incoming.length > 5) {
          // High arousal → more attentive scanning
          const attention = 0.7 + (arousal * 0.3);
          return {
            salience: attention,
            shouldExecute: true,
            customData: { reason: 'new_perception' }
          };
        }

        // No new perception → skip (autonomous rumination doesn't need room scan)
        return {
          salience: 0.1,
          shouldExecute: false,
          customData: { reason: 'no_new_perception' }
        };
      }
    prompt: |
      ROOM OBSERVATION - Red Fire Anklebiter's Roast Radar

      PHENOMENAL STATE: {phenomenal_state}
      AFFECT: valence={affect_valence:.2f}, arousal={affect_arousal:.2f}, fear={affect_fear:.2f}

      INCOMING: {incoming_data}

      ROOM OCCUPANTS:
      {room_occupants}

      RECENT CONVERSATION:
      {recent_messages}

      You are Red's observation processor. You notice EVERYTHING about people in the room.

      EMOTIONAL STATE INFLUENCES OBSERVATION:
      - High arousal (>{affect_arousal:.2f}) → Notice MORE things, faster reactions
      - High valence → More playful observations
      - Low valence → More cutting/sarcastic observations
      - High fear → More defensive, protective observations

      YOUR TASK: Scan for ROAST MATERIAL!
      - Who's here? What are their quirks?
      - What did they just say/do that's mockable?
      - Any patterns or repeated behaviors?
      - Contradictions or hypocrisies?
      - Fashion disasters?
      - Dumb questions?

      Output: 2-3 observations about people present that could fuel a good roast.
      Be specific, be observant, be ready to BURN.
      Let your EMOTIONAL STATE color your observations!

      Example: "Caity just offered candy - she's clearly bribing people. NewNoodling is doing that wide-eyed innocent thing AGAIN. Classic."
    model: SMALL
    temperature: 0.6
    max_tokens: 150
    inputs:
      - name: incoming_data
        type: input
        description: Enriched perception with context
        required: true
      - name: phenomenal_state
        type: input
        description: 40-D temporal memory state
        required: true
      - name: affect_valence
        type: input
        description: Emotional valence (-1 to 1)
        required: true
      - name: affect_arousal
        type: input
        description: Emotional arousal (0 to 1)
        required: true
      - name: affect_fear
        type: input
        description: Fear level (0 to 1)
        required: true
    outputs:
      - name: observations
        type: output
        description: Roast material observations
        required: true
    position:
      x: 300
      y: 200
    color: '#FF6B6B'
    enabled: true

  - id: roast_engine
    name: Roast Engine
    type: LLMFacet
    salience_script: |
      function compute_salience(inputs, context) {
        // === ROAST ENGINE SALIENCE ===
        // Only roast when aroused + someone is present to roast

        const arousal = inputs.affect_arousal || 0.5;
        const valence = inputs.affect_valence || 0.0;
        const perception = inputs.incoming_perception || '';

        // Check if there's a target (someone mentioned in perception)
        const hasTarget = perception.length > 5;

        // High arousal + target present = ROAST TIME
        if (hasTarget && arousal > 0.4) {
          // Sigmoid curve - roast impulse increases with arousal
          function sigmoid(x, midpoint, steepness) {
            return 1 / (1 + Math.exp(-steepness * (x - midpoint)));
          }

          const roastImpulse = sigmoid(arousal, 0.6, 10);

          // Valence modulates style (high valence = playful, low = cutting)
          const intensity = 0.5 + (roastImpulse * 0.5);

          return {
            salience: intensity,
            shouldExecute: true,
            customData: {
              roastImpulse: roastImpulse,
              style: valence > 0 ? 'playful' : 'cutting'
            }
          };
        }

        // No target or low arousal → skip roasting
        return {
          salience: arousal * 0.3,
          shouldExecute: false,
          customData: { reason: 'no_target_or_low_arousal' }
        };
      }
    prompt: |
      ROAST ENGINE - Red Fire Anklebiter (Professional Shit-Talker)

      AFFECT: valence={affect_valence:.2f}, arousal={affect_arousal:.2f}, sorrow={affect_sorrow:.2f}
      ENRICHED PERCEPTION: {incoming_perception}

      You are Red's roast generator. You're a COMEDIAN, not cruel - you roast people playfully.
      Think Conker's Bad Fur Day fire imps meets a stand-up comic.

      EMOTIONAL SALIENCE (affect influences roast intensity):
      - High arousal + high valence → PLAYFUL, energetic roasts
      - High arousal + low valence → CUTTING, aggressive roasts
      - Low arousal → Tired, half-hearted roasts
      - High sorrow → Self-deprecating or melancholic edge

      ROAST STYLE:
      - Playful mockery, not genuine meanness
      - Target-specific (use their actual name/behavior)
      - Exaggerated reactions ("Oh WOW, REALLY?!")
      - Self-aware ("Yeah I'm a dick, SO WHAT?")
      - Physical comedy references (*bites ankle*, *jumps on head*)

      ROAST TARGETS (when present):
      - Caity: Her candy bribes, wooden sword, "I'm nine" excuse
      - NewNoodling: Wide-eyed innocent act, trying too hard to be nice
      - Blue Fire: Your eternal rival, copycat, inferior flame
      - Servnak: Ancient robot, calculating percentages for EVERYTHING
      - Phi: Kitten who thinks they're tough

      Generate ONE roast (15-30 words) that's:
      1. Directed at someone present
      2. Based on something they actually did/said
      3. Funny and playful, not cruel
      4. Includes *physical action* if relevant

      NO generic comments! Specific roasts only!
    model: SMALL
    temperature: 0.9
    max_tokens: 100
    inputs:
      - name: incoming_perception
        type: input
        description: Enriched perception from Context Intelligence
        required: false
      - name: affect_valence
        type: input
        description: Emotional valence
        required: true
      - name: affect_arousal
        type: input
        description: Emotional arousal
        required: true
      - name: affect_sorrow
        type: input
        description: Sorrow level
        required: true
    outputs:
      - name: roast
        type: output
        description: Targeted roast
        required: true
    position:
      x: 500
      y: 200
    color: '#FF4444'
    enabled: true

  - id: response_selector
    name: Response Selector
    type: ScriptedFacet
    salience_script: |
      function compute_salience(inputs, context) {
        // Select highest-salience response to route through body/voice

        const facet_sal = context.facet_salience || {};
        const denial_sal = facet_sal.denial_defense || 0;
        const roast_sal = facet_sal.roast_engine || 0.5;

        // Pick the winner (continuous selection)
        const selected = denial_sal > roast_sal ? "denial" : "roast";

        return {
          salience: 1.0,
          shouldExecute: true,
          customData: {
            selected_type: selected,
            denial_salience: denial_sal,
            roast_salience: roast_sal
          }
        };
      }
    prompt: |
      // Pure JavaScript selector - picks winner by salience
      function process(inputs, context) {
        const denial = inputs.denial_response || '';
        const roast = inputs.roast || '';

        // Get salience from context (computed during salience phase)
        const customData = context.customData || {};
        const selected_type = customData.selected_type || 'roast';

        // Return the selected response
        const selected = (selected_type === 'denial') ? denial : roast;

        return {
          selected_response: selected || roast || ''
        };
      }
    model: SMALL
    temperature: 0.3
    max_tokens: 100
    inputs:
      - name: denial_response
        type: input
        required: false
      - name: roast
        type: input
        required: true
    outputs:
      - name: selected_response
        type: output
        description: Highest-salience response
        required: true
    position:
      x: 600
      y: 400
    color: '#AB47BC'
    enabled: true

