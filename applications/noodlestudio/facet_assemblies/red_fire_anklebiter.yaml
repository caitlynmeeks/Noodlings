  - id: context_intelligence
    name: Context Intelligence
    type: ContextIntelligenceFacet
    salience_script: |
      function compute_salience(inputs, context) {
        // Context Intelligence is for REACTIVE cognition only
        // Check GLOBAL incoming_data from context (not inputs, which aren't populated yet during salience!)

        const incoming = context.incoming_data || '';

        // No incoming data = autonomous cycle, skip this facet
        if (incoming.trim() === '') {
          return {
            salience: 0.0,
            shouldExecute: false,
            customData: { reason: 'no_incoming_data_autonomous_cycle' }
          };
        }

        // Has incoming data = reactive cycle, process it
        return {
          salience: 1.0,
          shouldExecute: true,
          customData: { reason: 'processing_incoming_perception' }
        };
      }
    prompt: 'THE GOD OF CONTEXT - Understanding WHO, WHAT, WHERE'
    model: SMALL
    temperature: 0.3
    max_tokens: 512
    inputs:
      - name: incoming_data
        type: input
        description: Raw perception to analyze
        required: true
    outputs:
      - name: speaker
        type: output
        description: Who is speaking
        required: true
      - name: addressee
        type: output
        description: Who they're addressing (you/name/everyone)
        required: true
      - name: speech_act
        type: output
        description: Type of communication (question/statement/command/emote)
        required: true
      - name: social_expectation
        type: output
        description: Response urgency (none/low/medium/high)
        required: true
      - name: enriched_perception
        type: output
        description: Text with explicit context added
        required: true
      - name: should_respond
        type: output
        description: Boolean - should this agent respond to this message?
        required: true
      - name: world_model_state
        type: output
        description: JSON of current world model
        required: false
    position:
      x: 150
      y: 450
    color: '#9B59B6'
    enabled: true
    locked: true
    metadata:
      agent_name: Red Fire Anklebiter

