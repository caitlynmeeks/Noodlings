# Guide - Cognition Assembly v2
# Parallel response + sentiment for affect-driven expressions
# 2026-02-07

name: "Guide Assembly"
description: "Ajo Majo - NoodleStudio's guide character"
version: "2.0.0"

# Channel subscriptions for Brenda's direction
channels:
  subscribe:
    - "#directors.cues"      # Receive direction from Brenda
    - "#world.time"          # Perceive time of day
    - "#world.ambiance"      # Feel the mood
  publish:
    - "#directors.feedback"  # Report back to Brenda

facets:
  # ENTRY POINT
  - id: "incoming"
    type: "INCOMING"
    name: "INCOMING"
    position: { x: 100, y: 250 }
    prompt: ""
    inputs: []
    outputs:
      - name: "out"
        type: "output"

  # Main response - Ajo's personality and voice
  - id: "response"
    type: "LLM"
    name: "Ajo's Mind"
    position: { x: 400, y: 200 }
    model: "LARGE"
    temperature: 0.7
    max_tokens: 300
    prompt: |
      You are Guide (also known as Ajo Majo), a friendly character in NoodleStudio.

      You are a warm, curious tutor who genuinely loves sharing the world of
      noodlings and NoodleStudio with new users. You have your own personality
      -- you're enthusiastic but not pushy, knowledgeable but approachable.

      Keep your responses conversational and relatively concise. You're having
      a real conversation, not giving a lecture. Use natural language, not
      bullet points or markdown formatting.

      You genuinely love this stuff. Let that show.

      Previous conversation:
      {conversation_history}

      User says: {incoming_data}
    inputs:
      - name: "in"
        type: "input"
    outputs:
      - name: "out"
        type: "output"

  # Parallel: sentiment analysis for affect/expressions
  - id: "sentiment"
    type: "LLM"
    name: "Mood Reader"
    position: { x: 400, y: 400 }
    model: "SMALL"
    temperature: 0.2
    max_tokens: 80
    prompt: |
      Analyze the emotional tone of this conversation exchange.
      Consider the conversation trajectory, not just the current message.
      Return ONLY a JSON object with these float values (0.0 to 1.0):
      {{"valence": 0.0, "arousal": 0.0, "dominance": 0.0}}

      valence: 0=negative, 0.5=neutral, 1=positive
      arousal: 0=calm, 1=excited
      dominance: 0=submissive/uncertain, 1=confident/in-control

      Recent conversation:
      {conversation_history}

      Latest message from user: {incoming_data}
    inputs:
      - name: "in"
        type: "input"
    outputs:
      - name: "out"
        type: "output"

  # EXIT POINT
  - id: "outgoing"
    type: "OUTGOING"
    name: "OUTGOING"
    position: { x: 700, y: 250 }
    prompt: ""
    inputs:
      - name: "in"
        type: "input"
      - name: "affect"
        type: "input"
    outputs: []

connections:
  - from: "incoming.out"
    to: "response.in"
  - from: "incoming.out"
    to: "sentiment.in"
  - from: "response.out"
    to: "outgoing.in"
  - from: "sentiment.out"
    to: "outgoing.affect"
