# NoodleCODE Recipes
# Step-by-step instructions for common tasks

recipes:

  create_basic_ui_app:
    description: "Create a simple app with UI"
    steps:
      - action: "keyboard_shortcut"
        keys: "Cmd+N"
        note: "Open New Project dialog"
      - action: "type"
        text: "{project_name}"
        note: "Enter project name"
      - action: "click"
        target: "Create button"
      - action: "wait"
        for: "Project loads"
      - action: "keyboard_shortcut"
        keys: "Cmd+Shift+T"
        note: "Rez new Thing"
      - action: "click"
        target: "New Thing in Stage hierarchy"
      - action: "click"
        target: "Inspector > + Add Component"
      - action: "click"
        target: "UI Canvas"
      - action: "note"
        text: "Now in UI Canvas edit mode - drag components from palette"

  add_button_with_action:
    description: "Add a button that triggers a facet assembly"
    prerequisite: "Thing with UI Canvas exists and is selected"
    steps:
      - action: "drag"
        from: "Component palette > Button"
        to: "UI Canvas"
      - action: "click"
        target: "New button in canvas"
      - action: "find"
        target: "Inspector > Events section"
      - action: "click"
        target: "On Click dropdown"
      - action: "select"
        option: "Run Assembly"
      - action: "click"
        target: "Assembly dropdown"
      - action: "select"
        option: "{assembly_name}"
      - action: "note"
        text: "Button now triggers assembly when clicked"

  create_llm_assembly:
    description: "Create a facet assembly that calls an LLM"
    steps:
      - action: "click"
        target: "Thing in Stage"
      - action: "click"
        target: "Inspector > + Add Component"
      - action: "click"
        target: "Facet Assembly"
      - action: "type"
        text: "{assembly_name}"
        note: "Name the assembly"
      - action: "click"
        target: "Bottom panel > Facets tab"
        note: "Opens Facets Editor"
      - action: "drag"
        from: "Palette > LLMFacet"
        to: "Canvas center"
      - action: "drag"
        from: "INCOMING node output"
        to: "LLMFacet input"
      - action: "drag"
        from: "LLMFacet output"
        to: "OUTGOING node input"
      - action: "double_click"
        target: "LLMFacet node"
        note: "Open properties"
      - action: "set"
        field: "System Prompt"
        value: "{system_prompt}"
      - action: "note"
        text: "Assembly ready - wire to UI or enable cognition loop"

  create_image_to_haiku_app:
    description: "Full app: drag image, get haiku"
    steps:
      - action: "recipe"
        name: "create_basic_ui_app"
        params:
          project_name: "HaikuVision"
      - action: "drag"
        from: "Palette > ImageDisplay"
        to: "Canvas top half"
      - action: "drag"
        from: "Palette > TextField"
        to: "Canvas bottom half"
      - action: "set"
        target: "TextField"
        field: "placeholder"
        value: "Haiku will appear here..."
      - action: "recipe"
        name: "create_llm_assembly"
        params:
          assembly_name: "haiku-generator"
          system_prompt: "You are a haiku poet. Given a description of an image, write a haiku about it. Output ONLY the haiku, nothing else."
      - action: "add_facet"
        type: "VisionFacet"
        position: "before LLMFacet"
        note: "Analyzes dropped image"
      - action: "wire"
        from: "ImageDisplay.onDrop"
        to: "haiku-generator assembly"
      - action: "wire"
        from: "assembly output"
        to: "TextField.text"
      - action: "keyboard_shortcut"
        keys: "Cmd+R"
        note: "Test it"
      - action: "test"
        steps:
          - "Drag an image onto ImageDisplay"
          - "Wait for haiku to appear in TextField"
          - "Verify haiku is 5-7-5 syllables"
      - action: "keyboard_shortcut"
        keys: "Cmd+B"
        note: "Build app"

  create_chat_interface:
    description: "Create a chat app with history and input"
    steps:
      - action: "recipe"
        name: "create_basic_ui_app"
        params:
          project_name: "ChatBot"
      - action: "drag"
        from: "Palette > Panel"
        to: "Canvas"
        note: "Container for chat"
      - action: "resize"
        target: "Panel"
        to: "full canvas area"
      - action: "drag"
        from: "Palette > ChatHistory"
        to: "Panel top 80%"
      - action: "drag"
        from: "Palette > ChatInput"
        to: "Panel bottom 20%"
      - action: "recipe"
        name: "create_llm_assembly"
        params:
          assembly_name: "chat-responder"
          system_prompt: "You are a helpful assistant. Respond conversationally."
      - action: "click"
        target: "ChatInput"
      - action: "find"
        target: "Inspector > Events section"
      - action: "wire"
        event: "onSend"
        action: "run_assembly"
        assembly: "chat-responder"
        inputs:
          prompt: "{event.value}"
      - action: "wire"
        from: "assembly output"
        to: "ChatHistory.addMessage"
      - action: "keyboard_shortcut"
        keys: "Cmd+R"
        note: "Test it"

  test_and_iterate:
    description: "Test current project and fix issues"
    steps:
      - action: "keyboard_shortcut"
        keys: "Cmd+S"
        note: "Save first"
      - action: "keyboard_shortcut"
        keys: "Cmd+R"
        note: "Run preview"
      - action: "interact"
        note: "Use the app as a user would"
      - action: "observe"
        targets:
          - "Does UI respond correctly?"
          - "Check Console for errors"
          - "Check Cognitive Cycles - are assemblies running?"
      - action: "if_error"
        steps:
          - "Read error message in Console"
          - "Identify which component/assembly failed"
          - "Stop preview (Cmd+.)"
          - "Fix the issue"
          - "Repeat test"
      - action: "if_success"
        steps:
          - "Stop preview"
          - "Proceed to build if ready"

  build_and_deliver:
    description: "Build final application"
    steps:
      - action: "keyboard_shortcut"
        keys: "Cmd+B"
      - action: "verify"
        field: "App Name"
        note: "Should be descriptive"
      - action: "click"
        target: "Build button"
      - action: "wait"
        for: "Build completes"
      - action: "verify"
        target: "Build success message"
      - action: "note"
        text: "App is at: {output_folder}/{app_name}.app"

  add_continuous_assembly:
    description: "Add an assembly that runs continuously in cognition loop"
    steps:
      - action: "click"
        target: "Thing in Stage"
      - action: "click"
        target: "Inspector > + Add Component"
      - action: "click"
        target: "Facet Assembly"
      - action: "type"
        text: "{assembly_name}"
      - action: "find"
        target: "Inspector > Facet Assembly section"
      - action: "check"
        checkbox: "Run in cognition loop"
      - action: "set"
        field: "Tick Rate"
        value: "{tick_rate_seconds}"
        note: "e.g., 0.5 for twice per second"
      - action: "note"
        text: "Assembly now runs continuously. Monitor in Cognitive Cycles panel."

  wire_ui_to_assembly:
    description: "Connect UI component event to facet assembly"
    prerequisite: "Both UI component and assembly exist"
    steps:
      - action: "click"
        target: "{ui_component} in canvas or hierarchy"
      - action: "find"
        target: "Inspector > Events section"
      - action: "click"
        target: "+ Add Event"
      - action: "select"
        option: "{event_type}"
        note: "e.g., onClick, onChange, onSubmit"
      - action: "select"
        from: "Action dropdown"
        option: "Run Assembly"
      - action: "select"
        from: "Assembly dropdown"
        option: "{assembly_name}"
      - action: "optional"
        action: "Configure input bindings"
        note: "Map UI values to assembly inputs"
      - action: "optional"
        action: "Configure output bindings"
        note: "Map assembly outputs to UI properties"

  bind_assembly_output_to_ui:
    description: "Make UI update when assembly produces output"
    steps:
      - action: "click"
        target: "{ui_component}"
      - action: "find"
        target: "Inspector > Properties"
      - action: "click"
        target: "Binding icon next to {property}"
        note: "Small chain-link icon"
      - action: "select"
        from: "Binding source"
        option: "{assembly_name}.{output_pad}"
      - action: "note"
        text: "Property now updates automatically when assembly runs"
